# Configuração do gitleaks. Mantém as regras padrão e libera SÓ valores fictícios conhecidos, pelo CONTEÚDO do valor
# e em qualquer pasta. Não se libera por pasta: nesta versão do gitleaks um caminho liberado passa qualquer segredo
# colado ali (testado), então um segredo real em teste, script ou workflow continua sendo apontado.
title = "Reparo360"

[extend]
useDefault = true

[[allowlists]]
description = "Valores fictícios de testes, do CI descartável e de scripts de medição (nenhum é segredo real)"
regexTarget = "secret"
regexes = [
  # Chave de 256 bits de teste (0123…cdef) e semente pública do Apêndice B da RFC 6238.
  '''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''',
  '''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''',
  # Senhas e segredos fictícios (contêm palavras como "senha", "sintético", "segredo", "errada", "temporária"...).
  '''(?i)^[a-z0-9_-]*(sintetic|senha|segredo|errada|temporaria|definitiva|vazar)[a-z0-9_-]*$''',
  # Chaves de idempotência de teste.
  '''^(abertura|corrida|reuso)-[0-9]+$''',
]
